<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pera Wallet Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #00ff88; margin-bottom: 20px; }
        button {
            background: #00ff88;
            border: none;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            font-size: 14px;
        }
        button:hover { background: #00dd77; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            min-height: 60px;
        }
        #address { font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟢 Pera Connect</h1>
        <button id="connectBtn">Connect Wallet</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
        <div id="status">
            <p>Status: <strong id="statusText">Not Connected</strong></p>
            <p id="address"></p>
        </div>
    </div>

    <!-- ⚠️ CRITICAL: SDK scripts MUST come BEFORE your code -->
    <script src="https://cdn.jsdelivr.net/gh/perawallet/connect-button@1.3.1/dist/perawallet.js"></script>

    <script>
        // Minimal working example
        const state = {
            wallet: null,
            connected: false,
            accounts: []
        };

        // 1. Initialize Pera Wallet
        function initWallet() {
            try {
                // Check if SDK loaded
                if (typeof peraWallet === 'undefined') {
                    throw new Error('Pera SDK not loaded');
                }

                // Create wallet instance with testnet
                state.wallet = new peraWallet({
                    network: 'testnet'
                });

                // Listen for connections
                state.wallet.connector?.on('connect', (accounts) => {
                    state.connected = true;
                    state.accounts = accounts;
                    updateUI();
                    console.log('✅ Connected:', accounts);
                });

                state.wallet.connector?.on('disconnect', () => {
                    state.connected = false;
                    state.accounts = [];
                    updateUI();
                    console.log('❌ Disconnected');
                });

                console.log('✅ Pera Wallet initialized');
            } catch (error) {
                console.error('❌ Init failed:', error);
                document.getElementById('statusText').textContent = 'Error: ' + error.message;
            }
        }

        // 2. Connect button click handler
        async function connectWallet() {
            try {
                const accounts = await state.wallet.connect();
                state.connected = true;
                state.accounts = accounts;
                updateUI();
            } catch (error) {
                console.error('Connection failed:', error);
                alert('Connection failed: ' + error.message);
            }
        }

        // 3. Disconnect button click handler
        async function disconnectWallet() {
            try {
                await state.wallet.disconnect();
                state.connected = false;
                state.accounts = [];
                updateUI();
            } catch (error) {
                console.error('Disconnect failed:', error);
            }
        }

        // 4. Update UI based on state
        function updateUI() {
            const statusText = document.getElementById('statusText');
            const addressEl = document.getElementById('address');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (state.connected && state.accounts.length > 0) {
                statusText.textContent = 'Connected ✓';
                addressEl.textContent = state.accounts[0];
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusText.textContent = 'Not Connected';
                addressEl.textContent = '';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        // 5. Attach event listeners
        document.getElementById('connectBtn').addEventListener('click', connectWallet);
        document.getElementById('disconnectBtn').addEventListener('click', disconnectWallet);

        // 6. Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWallet);
        } else {
            initWallet();
        }
    </script>
</body>
</html>
